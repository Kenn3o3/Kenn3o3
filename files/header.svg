<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Kenny Wong Lik Hang — Embodied AI and Robotics</title>
  <desc id="desc">Kenny Wong Lik Hang is an MPhil student at CUHK researching visuotactile perception and contact-rich robot manipulation.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3eb"/>
      <stop offset="1" stop-color="#eee7da"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef8a72"/>
      <stop offset="1" stop-color="#d95f4b"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6658"/>
      <stop offset="1" stop-color="#173f36"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18352e" flood-opacity=".14"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#234b41" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#paper)"/>
  <path d="M0 290C206 245 386 335 600 295c190-36 371-23 600 40v25H0Z" fill="#e5ddcf" opacity=".8"/>
  <rect x="808" y="0" width="392" height="360" fill="url(#dots)"/>

  <g transform="translate(62 58)">
    <g fill="none" stroke="#214c41" stroke-width="2">
      <path d="M0 9h38"/>
      <circle cx="44" cy="9" r="4" fill="#214c41" stroke="none"/>
    </g>
    <text x="0" y="66" fill="#16231f" font-family="Georgia, 'Iowan Old Style', Palatino, serif" font-size="52" font-weight="600">Kenny Wong Lik Hang</text>
    <text x="0" y="105" fill="#28594d" font-family="Georgia, 'Noto Serif CJK SC', 'Source Han Serif SC', serif" font-size="22" letter-spacing="3">&#29579;&#21147;&#24658;</text>
    <text x="0" y="158" fill="#39433f" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19">MPhil · Computer Science &amp; Engineering · CUHK</text>
    <text x="0" y="202" fill="#686b66" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17">Learning systems for robots that</text>
    <text x="282" y="202" fill="#1d4d41" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="700">see, feel, and act.</text>
  </g>

  <g transform="translate(820 44)" filter="url(#shadow)">
    <path d="M160 22 278 90v136l-118 68L42 226V90Z" fill="#fdfbf7" stroke="#214c41" stroke-width="2"/>
    <path d="m160 22 118 68-118 68L42 90Z" fill="#eff3ec" stroke="#214c41" stroke-width="2"/>
    <path d="M160 158v136M42 90l118 68 118-68" fill="none" stroke="#214c41" stroke-width="2"/>

    <g font-family="Arial, 'Helvetica Neue', sans-serif" text-anchor="middle">
      <circle cx="160" cy="91" r="36" fill="url(#sage)"/>
      <circle cx="91" cy="195" r="31" fill="#f3b99e"/>
      <circle cx="229" cy="195" r="31" fill="url(#coral)"/>

      <path d="M141 113 108 168M179 113l33 55M122 195h76" fill="none" stroke="#214c41" stroke-width="4" stroke-linecap="round"/>
      <circle cx="125" cy="139" r="5" fill="#f7f3eb" stroke="#214c41" stroke-width="2"/>
      <circle cx="195" cy="139" r="5" fill="#f7f3eb" stroke="#214c41" stroke-width="2"/>

      <text x="160" y="88" fill="#fff" font-size="12" font-weight="700" letter-spacing="2">SEE</text>
      <path d="M145 97q15 12 30 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="91" y="200" fill="#553024" font-size="12" font-weight="700" letter-spacing="2">FEEL</text>
      <text x="229" y="200" fill="#fff" font-size="12" font-weight="700" letter-spacing="2">ACT</text>

      <rect x="101" y="245" width="118" height="27" rx="13.5" fill="#214c41"/>
      <text x="160" y="263" fill="#fff" font-size="10" font-weight="700" letter-spacing="1.6">EMBODIED AI</text>
    </g>
  </g>
</svg>
